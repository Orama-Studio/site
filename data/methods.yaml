items:
  - title: "Contenuto e linguaggio"
    image: "metodo-1.png"
    phrase: >
      Partiamo da ciò che il video deve comunicare e da chi lo guarderà.
      La scrittura di una scena, la conduzione di un’intervista e il
      racconto di un evento richiedono approcci diversi: scegliamo il
      punto di vista, il tono e la forma narrativa più adatti al progetto.

  - title: "Immagine e suono"
    image: "metodo-2.png"
    phrase: >
      Curiamo inquadrature, luce e movimento insieme alla registrazione
      delle voci e dei suoni dell’ambiente. Nel montaggio lavoriamo sul
      rapporto tra immagini, parole e musica, per costruire il ritmo
      e guidare l’attenzione di chi guarda.

  - title: "Organizzazione"
    image: "metodo-3.png"
    phrase: >
      Organizziamo tempi, persone e attrezzature in base alle condizioni
      di ripresa, coordinando il lavoro con le attività del cliente,
      il programma dell’evento o le esigenze del set. Possiamo seguire
      la realizzazione completa oppure intervenire nelle singole fasi richieste.
