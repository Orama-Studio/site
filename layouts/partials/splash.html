<section class="is-black p-0 splash">
  <div class="splash-container">
    <video
      playsinline
      muted
      autoplay
      preload="metadata"
      poster="{{ "images/splash-home-poster.jpg" | relURL }}"
      width="1280"
      height="720"
      class="splash-video mutable-video">
      <source src="{{ "videos/splash-home-480p.mp4" | relURL }}" type="video/mp4" media="(max-width: 768px)" />
      <source src="{{ "videos/splash-home-720p.mp4" | relURL }}" type="video/mp4" />
    </video>
    {{ partial "mute_button" }}
  </div>
  <div class="p-0 has-text-centered has-text-weight-extrabold splash-tagline">
    <p class="is-size-1 is-size-4-mobile condensed">
      <span id="splash-word">Dai una forma alle tue visioni</span>
    </p>
  </div>
</section>
<script>
  const splash = document.getElementsByClassName("splash")[0];
  const splash_video = document.getElementsByClassName("splash-video")[0];
  splash_video.onended = (event) => {
    splash.style.height = 0;
  };
</script>
