baseURL = "https://orama-studio.github.io/site/"
languageCode = "it-it"
title = "Orama"

[[module.mounts]]
  source = "assets"
  target = "assets"

[[module.mounts]]
  source = "assets/images"
  target = "assets/images"

[[module.mounts]]
  source = "node_modules"
  target = "assets/node_modules"

[imaging]
  quality = 80
  resampleFilter = "Lanczos"
